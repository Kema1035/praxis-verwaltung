<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Aerzte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <h1 class="mb-4">Aerzte</h1>

    <a sec:authorize="hasRole('ADMIN')" th:href="@{/aerzte/new}" class="btn btn-success mb-3">Neuen Arzt hinzufuegen</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Fachrichtung</th>
            <th sec:authorize="hasRole('ADMIN')">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="arzt : ${aerzte}">
            <td th:text="${arzt.name}"></td>
            <td th:text="${arzt.fachrichtung}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/aerzte/edit/{id}(id=${arzt.id})}" class="btn btn-primary btn-sm">Bearbeiten</a>
                <button type="button" class="btn btn-danger btn-sm"
                        th:data-name="${arzt.name}"
                        th:data-url="@{/aerzte/delete/{id}(id=${arzt.id})}"
                        onclick="showDeleteModal(this)">Loeschen</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Bestaetigung</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Moechten Sie den Arzt <strong id="deleteName"></strong> wirklich loeschen?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <a id="deleteConfirmBtn" href="#" class="btn btn-danger">Loeschen</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showDeleteModal(btn) {
        document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteConfirmBtn').href = btn.getAttribute('data-url');
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }
</script>
</body>
</html>
