<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arztpraxis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <h1 th:text="${message}">Willkommen</h1>
    <p class="text-muted">Uebersicht der Arztpraxis</p>

    <!-- Общая статистика -->
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary text-center mb-3">
                <div class="card-body">
                    <h2 th:text="${patientenCount}">0</h2>
                    <p class="card-text">Patienten</p>
                    <a th:href="@{/patients}" class="btn btn-light btn-sm">Anzeigen</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success text-center mb-3">
                <div class="card-body">
                    <h2 th:text="${aerzteCount}">0</h2>
                    <p class="card-text">Aerzte</p>
                    <a th:href="@{/aerzte}" class="btn btn-light btn-sm">Anzeigen</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-info text-center mb-3">
                <div class="card-body">
                    <h2 th:text="${termineCount}">0</h2>
                    <p class="card-text">Termine gesamt</p>
                    <a th:href="@{/termine}" class="btn btn-light btn-sm">Anzeigen</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning text-center mb-3">
                <div class="card-body">
                    <h2 th:text="${termineHeuteCount}">0</h2>
                    <p class="card-text">Termine heute</p>
                    <a th:href="@{/termine}" class="btn btn-light btn-sm">Anzeigen</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Быстрые действия -->
    <div class="row mt-2 mb-4">
        <div class="col-12"><h4>Schnellzugriff</h4></div>
        <div class="col-md-4">
            <a th:href="@{/patients/new}" class="btn btn-outline-primary w-100 mb-2">+ Neuen Patienten</a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/aerzte/new}" class="btn btn-outline-success w-100 mb-2">+ Neuen Arzt</a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/termine/new}" class="btn btn-outline-info w-100 mb-2">+ Neuen Termin</a>
        </div>
    </div>

    <!-- Статистика по врачам -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Statistik nach Arzt</h5>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(arztStats)}" class="text-muted">
                Noch keine Termine vorhanden.
            </div>
            <table th:if="${!#lists.isEmpty(arztStats)}" class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Arzt</th>
                    <th>Fachrichtung</th>
                    <th>Anzahl Termine</th>
                    <th>Auslastung</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat : ${arztStats}">
                    <td th:text="${stat.name}"></td>
                    <td th:text="${stat.fachrichtung}"></td>
                    <td><strong th:text="${stat.count}"></strong></td>
                    <td style="width: 200px;">
                        <div class="progress">
                            <div class="progress-bar bg-success"
                                 th:style="'width: ' + (${stat.count} * 100 / ${termineCount}) + '%'"
                                 th:text="${stat.count} + ' / ' + ${termineCount}">
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
