<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Formular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" th:text="${patient.id} != null ? 'Patient bearbeiten' : 'Neuen Patienten hinzufuegen'"></h5>
        </div>
        <div class="card-body">
            <form th:action="@{/patients}" th:object="${patient}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" th:field="*{name}" class="form-control"
                               placeholder="Vor- und Nachname" required/>
                        <div th:if="${#fields.hasErrors('name')}" class="text-danger small"
                             th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label"> Geburtsdatum </label>
                        <input type="date"
                               th:field="*{geburtsdatum}"
                               th:value="${patient.geburtsdatum != null ? #temporals.format(patient.geburtsdatum, 'yyyy-MM-dd') : ''}"
                               class="form-control"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telefon</label>
                        <input type="text" th:field="*{telefon}" class="form-control"
                               placeholder="+49 151 12345678"/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Versicherung</label>
                        <select name="versicherung" class="form-control">
                            <option value="GESETZLICH"   th:selected="${patient.versicherung == null or patient.versicherung.name() == 'GESETZLICH'}">Gesetzlich (GKV)</option>
                            <option value="PRIVAT"       th:selected="${patient.versicherung != null and patient.versicherung.name() == 'PRIVAT'}">Privat (PKV)</option>
                            <option value="BEIHILFE"     th:selected="${patient.versicherung != null and patient.versicherung.name() == 'BEIHILFE'}">Beihilfe</option>
                            <option value="SELBSTZAHLER" th:selected="${patient.versicherung != null and patient.versicherung.name() == 'SELBSTZAHLER'}">Selbstzahler</option>
                        </select>
                    </div>
                </div>

                <div class="mt-2">
                    <button type="submit" class="btn btn-success">Speichern</button>
                    <a th:href="@{/patients}" class="btn btn-secondary ms-2">Zurueck</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
