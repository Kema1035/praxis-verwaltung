<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Termine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <h1 class="mb-4">Termine</h1>

    <!-- Все фильтры в одной форме -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Filtern</h5>
            <form th:action="@{/termine}" method="get">
                <div class="row g-2 mb-2">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Nach Datum</label>
                        <input type="date" name="datum" class="form-control" th:value="${datum}"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Von</label>
                        <input type="date" name="von" class="form-control" th:value="${von}"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Bis</label>
                        <input type="date" name="bis" class="form-control" th:value="${bis}"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Patient</label>
                        <input type="text" name="patientName" class="form-control"
                               placeholder="Name eingeben..." th:value="${patientName}"
                               list="patientList" autocomplete="off"/>
                        <datalist id="patientList">
                            <option th:each="name : ${patientNamen}" th:value="${name}"></option>
                        </datalist>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Arzt</label>
                        <input type="text" name="arztName" class="form-control"
                               placeholder="Name..." th:value="${arztName}"
                               list="arztList" autocomplete="off"/>
                        <datalist id="arztList">
                            <option th:each="name : ${arztNamen}" th:value="${name}"></option>
                        </datalist>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Status</label>
                        <select name="status" class="form-control">
                            <option value="">-- Alle --</option>
                            <option value="GEPLANT"    th:selected="${status == 'GEPLANT'}">Geplant</option>
                            <option value="BESTAETIGT" th:selected="${status == 'BESTAETIGT'}">Bestaetigt</option>
                            <option value="ABGESAGT"   th:selected="${status == 'ABGESAGT'}">Abgesagt</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary">Suchen</button>
                        <a th:href="@{/termine}" class="btn btn-secondary">Zuruecksetzen</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="mb-3 d-flex gap-2">
        <a th:href="@{/termine/new}" class="btn btn-success">Neuen Termin hinzufuegen</a>
        <a th:href="@{/export/termine/pdf}" class="btn btn-danger">PDF exportieren</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Patient</th>
            <th>Arzt</th>
            <th>Terminart</th>
            <th>Datum</th>
            <th>Uhrzeit</th>
            <th>Status</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(termine)}">
            <td colspan="6" class="text-center text-muted">Keine Termine gefunden.</td>
        </tr>
        <tr th:each="termin : ${termine}">
            <td th:text="${termin.patient.name}"></td>
            <td th:text="${termin.arzt.name}"></td>
            <td>
                <span th:if="${termin.terminArt != null}" class="badge bg-secondary"
                      th:text="${termin.terminArt.name() == 'ERSTUNTERSUCHUNG' ? 'Erstuntersuchung' :
                                 termin.terminArt.name() == 'KONTROLLTERMIN'   ? 'Kontrolltermin' :
                                 termin.terminArt.name() == 'NOTFALL'          ? 'Notfall' :
                                 termin.terminArt.name() == 'BERATUNG'         ? 'Beratung' :
                                 termin.terminArt.name() == 'VORSORGE'         ? 'Vorsorge' : 'Operation'}">
                </span>
            </td>
            <td th:text="${termin.datum}"></td>
            <td th:text="${termin.uhrzeit}"></td>
            <td>
                <span th:if="${termin.status.name() == 'GEPLANT'}"    class="badge bg-warning text-dark">Geplant</span>
                <span th:if="${termin.status.name() == 'BESTAETIGT'}" class="badge bg-success">Bestaetigt</span>
                <span th:if="${termin.status.name() == 'ABGESAGT'}"   class="badge bg-danger">Abgesagt</span>
            </td>
            <td>
                <a th:href="@{/termine/edit/{id}(id=${termin.id})}" class="btn btn-primary btn-sm">Bearbeiten</a>
                <button sec:authorize="hasRole('ADMIN')"
                        type="button" class="btn btn-danger btn-sm"
                        th:data-name="${termin.patient.name + ' - ' + termin.datum}"
                        th:data-url="@{/termine/delete/{id}(id=${termin.id})}"
                        onclick="showDeleteModal(this)">Loeschen</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Bestaetigung</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Moechten Sie den Termin <strong id="deleteName"></strong> wirklich loeschen?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <a id="deleteConfirmBtn" href="#" class="btn btn-danger">Loeschen</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showDeleteModal(btn) {
        document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteConfirmBtn').href = btn.getAttribute('data-url');
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }
</script>
</body>
</html>
