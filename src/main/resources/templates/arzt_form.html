<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arzt Formular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <h1 th:text="${arzt.id} != null ? 'Arzt bearbeiten' : 'Neuen Arzt hinzufügen'">Arzt</h1>

    <form th:action="@{/aerzte}" th:object="${arzt}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   placeholder="z.B. Dr. Max Mustermann" required/>
            <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fachrichtung</label>
            <input type="text" th:field="*{fachrichtung}" class="form-control"
                   placeholder="z.B. Kardiologie" required/>
            <div th:if="${#fields.hasErrors('fachrichtung')}" class="text-danger" th:errors="*{fachrichtung}"></div>
        </div>

        <button type="submit" class="btn btn-success">Speichern</button>
        <a th:href="@{/aerzte}" class="btn btn-secondary">Zurück</a>
    </form>
</div>

</body>
</html>
