<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Rezepte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <h1 class="mb-4">Rezepte</h1>

    <a th:href="@{/rezepte/new}" class="btn btn-success mb-3">Neues Rezept ausstellen</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Patient</th>
            <th>Arzt</th>
            <th>Medikament</th>
            <th>Dosierung</th>
            <th>Ausgestellt</th>
            <th>Gueltig bis</th>
            <th>Status</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(rezepte)}">
            <td colspan="8" class="text-center text-muted">Keine Rezepte vorhanden.</td>
        </tr>
        <tr th:each="r : ${rezepte}">
            <td th:text="${r.patient.name}"></td>
            <td th:text="${r.arzt.name}"></td>
            <td><strong th:text="${r.medikament}"></strong></td>
            <td th:text="${r.dosierung}"></td>
            <td th:text="${r.ausstellungsdatum}"></td>
            <td th:text="${r.gueltigBis}"></td>
            <td>
                <span th:if="${r.status.name() == 'AUSGESTELLT'}" class="badge bg-primary">Ausgestellt</span>
                <span th:if="${r.status.name() == 'EINGELOEST'}"  class="badge bg-success">Eingeloest</span>
                <span th:if="${r.status.name() == 'ABGELAUFEN'}"  class="badge bg-danger">Abgelaufen</span>
            </td>
            <td>
                <a th:href="@{/rezepte/edit/{id}(id=${r.id})}" class="btn btn-primary btn-sm">Bearbeiten</a>
                <button sec:authorize="hasRole('ADMIN')"
                        type="button" class="btn btn-danger btn-sm"
                        th:data-name="${r.medikament + ' - ' + r.patient.name}"
                        th:data-url="@{/rezepte/delete/{id}(id=${r.id})}"
                        onclick="showDeleteModal(this)">Loeschen</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальное окно удаления -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Bestaetigung</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Moechten Sie das Rezept <strong id="deleteName"></strong> wirklich loeschen?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Abbrechen</button>
                <a id="deleteConfirmBtn" href="#" class="btn btn-danger">Loeschen</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function showDeleteModal(btn) {
        document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
        document.getElementById('deleteConfirmBtn').href = btn.getAttribute('data-url');
        new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }
</script>
</body>
</html>
