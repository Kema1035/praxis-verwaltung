<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Termin Formular</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" th:text="${termin.id} != null ? 'Termin bearbeiten' : 'Neuen Termin hinzufuegen'"></h5>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/termine}" th:object="${termin}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Patient</label>
                        <select th:field="*{patient.id}" class="form-control" required>
                            <option value="">-- Bitte auswaehlen --</option>
                            <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Arzt</label>
                        <select th:field="*{arzt.id}" class="form-control" required>
                            <option value="">-- Bitte auswaehlen --</option>
                            <option th:each="a : ${aerzte}" th:value="${a.id}" th:text="${a.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Datum</label>
                        <input type="date" th:field="*{datum}" class="form-control" required/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Uhrzeit (08:00 - 18:00)</label>
                        <input type="time" th:field="*{uhrzeit}" class="form-control"
                               min="08:00" max="18:00" required/>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-control">
                            <option value="GEPLANT"    th:selected="${termin.status == null or termin.status.name() == 'GEPLANT'}">Geplant</option>
                            <option value="BESTAETIGT" th:selected="${termin.status != null and termin.status.name() == 'BESTAETIGT'}">Bestaetigt</option>
                            <option value="ABGESAGT"   th:selected="${termin.status != null and termin.status.name() == 'ABGESAGT'}">Abgesagt</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Terminart</label>
                        <select name="terminArt" class="form-control">
                            <option value="ERSTUNTERSUCHUNG" th:selected="${termin.terminArt == null or termin.terminArt.name() == 'ERSTUNTERSUCHUNG'}">Erstuntersuchung</option>
                            <option value="KONTROLLTERMIN"   th:selected="${termin.terminArt != null and termin.terminArt.name() == 'KONTROLLTERMIN'}">Kontrolltermin</option>
                            <option value="NOTFALL"          th:selected="${termin.terminArt != null and termin.terminArt.name() == 'NOTFALL'}">Notfall</option>
                            <option value="BERATUNG"         th:selected="${termin.terminArt != null and termin.terminArt.name() == 'BERATUNG'}">Beratung</option>
                            <option value="VORSORGE"         th:selected="${termin.terminArt != null and termin.terminArt.name() == 'VORSORGE'}">Vorsorge</option>
                            <option value="OPERATION"        th:selected="${termin.terminArt != null and termin.terminArt.name() == 'OPERATION'}">Operation</option>
                        </select>
                    </div>
                </div>

                <div class="mt-2">
                    <button type="submit" class="btn btn-success">Speichern</button>
                    <a th:href="@{/termine}" class="btn btn-secondary ms-2">Zurueck</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
