<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Arztpraxis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h4 class="mb-0">Arztpraxis System</h4>
                    <small>Bitte anmelden</small>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger">
                        Falscher Benutzername oder Passwort!
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        Erfolgreich abgemeldet.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Benutzername</label>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Benutzername" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Passwort</label>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Passwort" required/>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Anmelden</button>
                    </form>
                </div>
                <div class="card-footer text-muted text-center small">
                    Admin: admin / 12345 &nbsp;|&nbsp; User: user / hochschule123
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
